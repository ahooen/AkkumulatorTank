<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Varmesystem"/>
<meta name="theme-color" content="#08111f"/>
<meta name="format-detection" content="telephone=no"/>
<title>Varmesystem</title>
<!-- Preconnect for faster font load -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/></noscript>
<style>
/* ── TOKENS ── */
:root{
  --bg:#08111f;--s1:#0d1828;--s2:#111f35;--s3:#172440;
  --b1:rgba(255,255,255,.055);--b2:rgba(255,255,255,.1);
  --t1:#dce8f8;--t2:#7b96b8;--t3:#3d5878;
  --acc:#3b7df8;--teal:#00d4b8;
  --f:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
  --m:'JetBrains Mono','SF Mono',ui-monospace,monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --r:14px;
}

/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none}

/* Tooltip-bindable elements: no text selection on long-press */
.sr, .mc, .scop-c, .bp, .panel, .scene, #svg, #svg *,
.sr *, .mc *, .scop-c *, .bp * {
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  user-select:none;
}

/* But still allow text selection in config inputs */
.cfi { -webkit-user-select:auto; user-select:auto; }
html{background:var(--bg);height:-webkit-fill-available}
body{font-family:var(--f);color:var(--t1);
  min-height:100svh;min-height:-webkit-fill-available;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;overscroll-behavior-y:contain}

/* ── HEADER ── */
.hdr{
  background:rgba(8,17,31,.97);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--b1);
  padding-top:var(--safe-top);
  position:relative;z-index:10}
.hdr-i{
  display:flex;align-items:center;
  justify-content:space-between;gap:8px;
  padding:.55rem 1rem}
.hdr-s{font:500 11px/1 var(--m);color:var(--t3);
  transition:color .3s}
.hdr-s.live{color:#22c55e}
.hdr-s.err{color:#f87171}

/* ── BUTTON ── */
.btn{
  background:rgba(59,125,248,.1);
  border:1px solid rgba(59,125,248,.25);
  color:#60a5fa;padding:6px 13px;
  border-radius:8px;font:500 12px/1 var(--m);
  cursor:pointer;display:flex;align-items:center;gap:6px;
  touch-action:manipulation;
  transition:background .12s,transform .1s;
  user-select:none;-webkit-user-select:none}
.btn:active{background:rgba(59,125,248,.25);transform:scale(.97)}
.btn svg{width:13px;height:13px;flex-shrink:0}
.spin{animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Pipe flow dash animations */
/* Flow directions:
   flowR = dashes move RIGHT  (hot TUR: VP→tank)
   flowL = dashes move LEFT   (cold retur: tank→VP)
   flowD = dashes move DOWN   (brine OUT: VP→borehole, horizontal then down)
   flowU = dashes move UP     (brine IN:  borehole→VP, up then horizontal) */
@keyframes flowR{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
@keyframes flowL{from{stroke-dashoffset:0}to{stroke-dashoffset:40}}
@keyframes flowD{from{stroke-dashoffset:0}to{stroke-dashoffset:40}}
@keyframes flowU{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
.pf-hot {stroke-dasharray:14 12;animation:flowR 2.2s linear infinite}
.pf-cold{stroke-dasharray:14 12;animation:flowR 2.2s linear infinite}
.pf-geoO{stroke-dasharray:13 12;animation:flowU 2.8s linear infinite}
.pf-geoI{stroke-dasharray:13 12;animation:flowU 2.8s linear infinite}
.pf-off {stroke-dasharray:none;animation:none}

/* ── SCROLL AREA ── */
.wrap{
  padding:.7rem 1rem calc(1.5rem + var(--safe-bot));
  max-width:960px;margin:0 auto}

/* ── SCENE ── */
.scene{
  background:linear-gradient(160deg,#0c1a30,#08111f 55%,#0c1a30);
  border:1px solid var(--b1);border-radius:16px;
  overflow:hidden;position:relative;
  margin-bottom:.85rem}
.scene::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 12% 50%,rgba(59,125,248,.06) 0,transparent 50%),
    radial-gradient(ellipse at 88% 50%,rgba(0,212,184,.05) 0,transparent 50%)}
#svg{width:100%;height:auto;display:block;
  /* Prevent text selection on long-press */
  -webkit-user-select:none;user-select:none}

/* ── GRID ── */
.grid{display:grid;gap:.7rem;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

/* ── PANEL ── */
.panel{background:var(--s1);border:1px solid var(--b1);
  border-radius:var(--r);padding:.85rem .95rem}
.ph{display:flex;align-items:center;gap:6px;margin-bottom:.7rem}
.phd{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.pt{font:600 9px/1 var(--f);color:var(--t3);
  letter-spacing:.12em;text-transform:uppercase}

/* ── SENSOR ROWS ── */
.sr{display:flex;align-items:center;gap:9px;
  padding:5.5px 4px;
  border-bottom:1px solid rgba(255,255,255,.032);
  border-radius:6px;cursor:pointer;
  touch-action:manipulation;transition:background .1s}
.sr:last-child{border-bottom:none}
.sr:active{background:rgba(255,255,255,.045)}
.sd{width:7px;height:7px;border-radius:50%;flex-shrink:0;
  transition:box-shadow .4s}
.sp{font:400 10px/1 var(--m);color:var(--t3);
  width:26px;text-align:right;flex-shrink:0}
.sn{font:400 12px/1 var(--f);color:var(--t2);flex:1}
.sv{font:500 14px/1 var(--m);color:var(--t1)}

/* ── METRIC CARDS ── */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mc{background:var(--s2);border:1px solid var(--b1);
  border-radius:10px;padding:10px 11px;
  cursor:pointer;touch-action:manipulation;
  transition:border-color .12s}
.mc:active{border-color:var(--b2)}
.ml{font:600 9px/1 var(--f);color:var(--t3);
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.mv{font:600 19px/1 var(--m);color:var(--t1)}
.mu{font:400 10px/1 var(--m);color:var(--t3);margin-left:2px}

/* ── SCOP CARD ── */
.scop-c{
  background:linear-gradient(135deg,
    rgba(0,212,184,.09),rgba(0,212,184,.02));
  border:1px solid rgba(0,212,184,.17);
  border-radius:10px;padding:12px 13px;
  display:flex;align-items:center;gap:12px;
  margin-bottom:7px;cursor:pointer;
  touch-action:manipulation;
  transition:border-color .12s}
.scop-c:active{border-color:rgba(0,212,184,.35)}
.scop-i{width:40px;height:40px;border-radius:9px;flex-shrink:0;
  background:rgba(0,212,184,.1);
  border:1px solid rgba(0,212,184,.18);
  display:flex;align-items:center;justify-content:center;
  font-size:18px}
.scop-l{font:600 9px/1 var(--f);color:var(--teal);
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.scop-v{font:700 26px/1 var(--m);color:var(--teal)}
.scop-m{font:400 11px/1 var(--f);color:var(--t2);margin-top:4px}

/* ── BRINE PILLS ── */
.br{display:flex;gap:6px}
.bp{flex:1;background:var(--s2);border:1px solid var(--b1);
  border-radius:10px;padding:9px 11px;
  cursor:pointer;touch-action:manipulation;
  transition:border-color .12s}
.bp:active{border-color:var(--b2)}
.bl{font:600 9px/1 var(--f);color:var(--t3);
  letter-spacing:.09em;text-transform:uppercase;margin-bottom:3px}
.bv{font:600 16px/1 var(--m);color:var(--teal)}
.bu{font:400 9px/1 var(--m);color:var(--t3)}

/* ── TOOLTIP ── */
.tt{position:fixed;z-index:999;
  background:#16243e;
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:11px 13px;
  min-width:178px;pointer-events:none;
  opacity:0;transition:opacity .14s;
  box-shadow:0 16px 48px rgba(0,0,0,.65)}
.tt.on{opacity:1}
.tt-t{font:600 9px/1 var(--f);color:var(--t3);
  text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.tt-v{font:600 19px/1 var(--m);color:var(--t1);margin-bottom:9px}
.tt-g{width:100%;height:40px;display:block}
.tt-r{display:flex;justify-content:space-between;
  margin-top:3px;font:400 9px/1 var(--m);color:var(--t3)}
.tt-h{font:400 9px/1 var(--f);color:var(--t3);
  text-align:center;margin-top:5px;opacity:.6}

/* ── CONFIG ── */
.cfg{background:var(--s1);border:1px solid var(--b1);
  border-radius:var(--r);overflow:hidden;margin-top:.7rem}
.cft{width:100%;padding:.75rem .95rem;background:none;border:none;
  color:var(--t2);font:400 12px/1 var(--f);
  cursor:pointer;display:flex;align-items:center;
  justify-content:space-between;gap:8px;text-align:left;
  touch-action:manipulation;-webkit-user-select:none}
.cft svg{width:13px;height:13px;color:var(--t3);
  flex-shrink:0;transition:transform .2s}
.cft.open svg{transform:rotate(180deg)}
.cfb{display:none;padding:0 .95rem .95rem;
  border-top:1px solid var(--b1)}
.cfb.open{display:block}
.cff{display:flex;flex-direction:column;gap:4px;margin-top:.7rem}
.cfl{font:500 10px/1 var(--f);color:var(--t3);letter-spacing:.06em}
.cfi{background:var(--bg);border:1px solid var(--b1);
  border-radius:8px;color:var(--t1);
  font:400 12px/1 var(--m);padding:8px 10px;
  outline:none;width:100%;
  /* Prevent iOS zoom on input focus */
  font-size:16px;
  transition:border-color .2s}
.cfi:focus{border-color:rgba(59,125,248,.5)}
.cfh{font:400 11px/1.6 var(--f);color:var(--t3);
  margin-top:.7rem;padding-top:.7rem;
  border-top:1px solid var(--b1)}
.err{font:400 11px/1.6 var(--m);color:#f87171;
  padding:.6rem .95rem;display:none;
  background:rgba(248,113,113,.05);
  border-top:1px solid rgba(248,113,113,.12)}

/* ── RESPONSIVE ── */
@media(max-width:390px){
  .wrap{padding:.6rem .75rem calc(1.5rem + var(--safe-bot))}
  .mv{font-size:17px}.scop-v{font-size:22px}.bv{font-size:15px}
  .panel,.cfg{border-radius:12px}
}
@media(prefers-color-scheme:light){
  /* Keep dark – this is an intentional dark UI */
  :root{color-scheme:dark}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-i">
    <span class="hdr-s" id="sts">Klar</span>
    <button class="btn" id="rbtn" onclick="doFetch()">
      <svg id="rico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5
                 M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>
      </svg>
      Oppdater
    </button>
  </div>
</div>

<div class="tt" id="tt">
  <div class="tt-t" id="ttt"></div>
  <div class="tt-v" id="ttv"></div>
  <svg class="tt-g" id="ttg"
       viewBox="0 0 170 40" preserveAspectRatio="none"></svg>
  <div class="tt-r">
    <span id="ttn"></span><span id="ttx"></span>
  </div>
  <div class="tt-h" id="tth"></div>
</div>

<div class="wrap">
  <div class="scene">
    <svg id="svg" viewBox="0 0 680 355"
         xmlns="http://www.w3.org/2000/svg"
         preserveAspectRatio="xMidYMid meet"
         aria-hidden="true"></svg>
  </div>

  <div class="grid">
    <!-- Tank levels -->
    <div class="panel">
      <div class="ph">
        <div class="phd" style="background:#3b7df8"></div>
        <div class="pt">Akkumulatortank · 500 L</div>
      </div>
      <div id="rows"></div>
    </div>

    <!-- Tank metrics -->
    <div class="panel">
      <div class="ph">
        <div class="phd" style="background:#60a5fa"></div>
        <div class="pt">Tanknøkkeltall</div>
      </div>
      <div class="mg">
        <div class="mc" id="mSnitt">
          <div class="ml">Snitt</div>
          <div class="mv" id="vSnitt">–<span class="mu">°C</span></div>
        </div>
        <div class="mc" id="mEnergi">
          <div class="ml">Energi</div>
          <div class="mv" id="vEnergi">–<span class="mu">kWh</span></div>
        </div>
        <div class="mc" id="mDtb">
          <div class="ml">ΔT Topp–Bunn</div>
          <div class="mv" id="vDtb">–<span class="mu">K</span></div>
        </div>
        <div class="mc" id="mDvp">
          <div class="ml">ΔT VP</div>
          <div class="mv" id="vDvp">–<span class="mu">K</span></div>
        </div>
      </div>
    </div>

    <!-- NIBE -->
    <div class="panel">
      <div class="ph">
        <div class="phd" style="background:#00d4b8"></div>
        <div class="pt">NIBE S1256 · 8 kW</div>
      </div>
      <div class="scop-c" id="mScop">
        <div class="scop-i">⚡</div>
        <div>
          <div class="scop-l">Årsytelse SCOP</div>
          <div class="scop-v" id="vScop">–</div>
          <div class="scop-m" id="vMod">–</div>
        </div>
      </div>
      <div class="br">
        <div class="bp" id="mBrineIn">
          <div class="bl">Brine inn · BT10</div>
          <div class="bv" id="vBrineIn">–<span class="bu"> °C</span></div>
        </div>
        <div class="bp" id="mBrineOut">
          <div class="bl">Brine ut · BT11</div>
          <div class="bv" id="vBrineOut">–<span class="bu"> °C</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="cfg">
    <button class="cft" id="cft"
      onclick="tCfg()"
      ontouchend="event.preventDefault();tCfg()">
      <span>⚙ Tilkobling · Homey ID og API Key</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </button>
    <div class="cfb" id="cfb">
      <div class="cff">
        <label class="cfl" for="hid">Homey ID</label>
        <input class="cfi" id="hid" type="text"
               inputmode="url" autocomplete="off" spellcheck="false"
               autocorrect="off" autocapitalize="none"
               placeholder="abc123.connect.athom.com"/>
      </div>
      <div class="cff">
        <label class="cfl" for="hkey">API Key</label>
        <input class="cfi" id="hkey" type="password"
               autocomplete="current-password"
               placeholder="Lim inn API Key"/>
      </div>
      <div class="cfh">
        Finn på
        <a href="https://my.homey.app" target="_blank" rel="noopener"
           style="color:#60a5fa;text-decoration:none">my.homey.app</a>
        → Innstillinger → API Keys → Opprett ny
        (kun <em>Devices: Read</em>).
      </div>
    </div>
    <div class="err" id="err"></div>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════
const CAP = 'devicecapabilities_number.number1';

const SENSORS = [
  {pct:100, name:'Topp',   dev:'Akkumulator Sensor Nr.1 (Øverst)'},
  {pct:75,  name:'Tur VP', dev:'Akkumulator Sensor Nr.2 (Tur fra VP)'},
  {pct:50,  name:'Midt',   dev:'Akkumulator Sensor Nr.3'},
  {pct:25,  name:'Nedre',  dev:'Akkumulator Sensor Nr.4'},
  {pct:0,   name:'Retur',  dev:'Akkumulator Sensor Nr.5 (Retur)'},
];

const DEV = {
  scop    : 'Nibe S1256-8kw',
  brineIn : 'Nibe Brine Inn',
  brineOut: 'Nibe Brine Ut',
  supply  : 'Nibe Supply Line',
  power   : 'Nibe System Power',
  hotWater: 'Nibe Hot Water',
  compHz  : 'Nibe Kompressor Hz',
  degMin  : 'Nibe Gradminutter',
  bt7     : 'Nibe BT7',   // Hot water top temp – rising = DHW production
};

const REF = 25, KWH = 0.5815;
const MAX_PTS = 48;   // ~4 hours at 5-min intervals
const LS_KEY  = 'vs4';

// ═══════════════════════════════════════════
// HISTORY  (localStorage persistence)
// ═══════════════════════════════════════════
const H = {
  t100:[], t75:[], t50:[], t25:[], t0:[],
  snitt:[], energi:[], dtb:[], dvp:[],
  scop:[], brineIn:[], brineOut:[],
  bt7:[],   // BT7 hot water top – rising = DHW production
  pTerm:[], // Thermal power delivered (kW) = electric power × SCOP
};

const r1 = v => Math.round(v * 10) / 10;
const r2 = v => Math.round(v * 100) / 100;

function ph(k, v) {
  if (v == null || !isFinite(v)) return;
  H[k].push(r1(v));
  if (H[k].length > MAX_PTS) H[k].shift();
}

function savH() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(H)); } catch(_) {}
}

function lodH() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    Object.keys(H).forEach(k => {
      if (Array.isArray(d[k])) H[k] = d[k].slice(-MAX_PTS);
    });
  } catch(_) {}
}

// ═══════════════════════════════════════════
// COLOR HELPERS
// ═══════════════════════════════════════════
const TEMP_STOPS = [
  {v:0,  c:[56,189,248]},   // cold blue
  {v:25, c:[52,211,153]},   // cool green
  {v:35, c:[251,191,36]},   // warm yellow
  {v:45, c:[239,68,68]},    // hot red (max for accumulator tank)
];

function tCol(t) {
  if (t == null) return '#2a3a50';
  let a = TEMP_STOPS[0], b = TEMP_STOPS[TEMP_STOPS.length - 1];
  for (let i = 0; i < TEMP_STOPS.length - 1; i++) {
    if (t >= TEMP_STOPS[i].v && t < TEMP_STOPS[i+1].v) {
      a = TEMP_STOPS[i]; b = TEMP_STOPS[i+1]; break;
    }
  }
  const f = Math.min(1, Math.max(0, (t - a.v) / (b.v - a.v)));
  return `rgb(${Math.round(a.c[0]+(b.c[0]-a.c[0])*f)},`
       + `${Math.round(a.c[1]+(b.c[1]-a.c[1])*f)},`
       + `${Math.round(a.c[2]+(b.c[2]-a.c[2])*f)})`;
}

const lc = (c, a) => { const m = c.match(/\d+/g).map(Number);
  return `rgb(${Math.min(255,m[0]+a)},${Math.min(255,m[1]+a)},${Math.min(255,m[2]+a)})`; };
const dc = (c, a) => { const m = c.match(/\d+/g).map(Number);
  return `rgb(${Math.max(0,m[0]-a)},${Math.max(0,m[1]-a)},${Math.max(0,m[2]-a)})`; };

// ═══════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════
let _ttTO = null;

function showTT(el, label, hk, unit) {
  const data = H[hk] || [];
  const last = data.length ? data[data.length - 1] : null;
  document.getElementById('ttt').textContent = label;
  document.getElementById('ttv').textContent = last != null ? `${last} ${unit}` : '–';

  const g = document.getElementById('ttg');
  const n = data.length;

  if (n > 2) {
    const mn = Math.min(...data), mx = Math.max(...data), rng = mx - mn || 1;
    const pts = data.map((v, i) =>
      `${(i/(n-1))*170},${40 - ((v-mn)/rng)*34 - 3}`).join(' ');
    document.getElementById('ttn').textContent = mn.toFixed(1) + unit;
    document.getElementById('ttx').textContent = mx.toFixed(1) + unit;
    document.getElementById('tth').textContent =
      `${n} målinger · siste ${Math.round(n*5/60*10)/10}t`;
    g.innerHTML = `<defs>
      <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3b7df8" stop-opacity=".25"/>
        <stop offset="100%" stop-color="#3b7df8" stop-opacity="0"/>
      </linearGradient></defs>
      <polygon points="0,40 ${pts} 170,40" fill="url(#gg)"/>
      <polyline points="${pts}" fill="none" stroke="#3b7df8"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else {
    document.getElementById('ttn').textContent = '';
    document.getElementById('ttx').textContent = '';
    document.getElementById('tth').textContent =
      n === 0 ? 'Ingen data ennå' : `${n}/3 målinger – holder på…`;
    g.innerHTML = `<text x="85" y="23" text-anchor="middle"
      font-size="9" fill="#3d5878" font-family="monospace">Samler data…</text>`;
  }

  const r = el.getBoundingClientRect();
  let lx = r.left + window.scrollX + r.width / 2 - 89;
  let ty = r.top + window.scrollY - 148;
  if (ty < 60) ty = r.bottom + window.scrollY + 8;
  if (lx < 6) lx = 6;
  if (lx + 192 > window.innerWidth) lx = window.innerWidth - 197;

  const tt = document.getElementById('tt');
  tt.style.cssText = `left:${lx}px;top:${ty}px`;
  tt.classList.add('on');
  clearTimeout(_ttTO);
}

function hideTT() {
  _ttTO = setTimeout(
    () => document.getElementById('tt').classList.remove('on'), 320);
}

// Track which DOM elements already have tooltip handlers (prevents memory leak)
const _ttBound = new WeakSet();

function btt(el, label, hk, unit) {
  // Update label/hk/unit on element so handlers can read current values
  el._ttLabel = label; el._ttHk = hk; el._ttUnit = unit;

  if (_ttBound.has(el)) return;  // already bound – just update refs above
  _ttBound.add(el);

  // Subtle haptic feedback on long-press (iOS Safari supports navigator.vibrate)
  const haptic = () => { try { navigator.vibrate && navigator.vibrate(8); } catch(_){} };

  el.addEventListener('mouseenter', () => showTT(el, el._ttLabel, el._ttHk, el._ttUnit));
  el.addEventListener('mouseleave', hideTT);

  let tmr = null, moved = false, sx = 0, sy = 0;

  el.addEventListener('touchstart', e => {
    moved = false;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    tmr = setTimeout(() => {
      if (!moved) { haptic(); showTT(el, el._ttLabel, el._ttHk, el._ttUnit); }
    }, 500);
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    const dx = Math.abs(e.touches[0].clientX - sx);
    const dy = Math.abs(e.touches[0].clientY - sy);
    if (dx > 8 || dy > 8) {
      moved = true;
      clearTimeout(tmr);
      hideTT();
    }
  }, { passive: true });

  el.addEventListener('touchend', () => {
    clearTimeout(tmr);
    setTimeout(hideTT, 2500);
  }, { passive: true });
}

// ═══════════════════════════════════════════
// SVG SCENE
// ═══════════════════════════════════════════
function buildSvg(temps, nibe) {
  // ── Layout ──────────────────────────────
  const tCX=96, tW=68, tTop=24, tBot=330, tH=tBot-tTop, tRx=12, eRy=10;
  const lblX=14, dotX=tCX-tW/2-3;
  const vpX=248, vpY=46, vpW=110, vpH=265;
  const vpRX = vpX + vpW;
  const wCX=590, wBotY=330, wW=30;
  const p1x=wCX-10, p2x=wCX+10;

  // ── Fill logic ──────────────────────────
  const vld = temps.filter(t => t != null);
  const snitt = vld.length ? vld.reduce((a,b) => a+b, 0)/vld.length : 30;
  const returT = temps[4] ?? 25;
  const turVP  = nibe.supply;
  const pwr    = nibe.power ?? 0;

  // VP heating tank = running (>0.1 kW) AND supply line significantly warmer than return
  const vpHeat = pwr > 0.2 && turVP != null && turVP > (returT + 3);
  // pClass for pipe animations – animate whenever compressor runs (power > 0.1 kW)
  const pClass = pwr > 0.2 ? '' : 'pf-off';

  let fillF;
  if (vpHeat) {
    const rng = turVP - returT;
    fillF = rng > 1
      ? Math.min(.96, Math.max(.04, (snitt - returT) / rng))
      : 0.5;
  } else {
    // Static scale: 25°C=0%, 40°C=100%
    fillF = Math.min(.96, Math.max(.04, (snitt - 25) / 15));
  }

  const fillY = tBot - tH * fillF;
  const wB = tCol(snitt), wL = lc(wB, 55), wD = dc(wB, 35), wS = lc(wB, 75);

  // ── Pipe Y positions ────────────────────
  const hotY = tTop + 27, coldY = tBot - 27;
  const boY  = vpY + vpH * 0.28;
  const biY  = vpY + vpH * 0.72;

  // Geo pipe endpoints
  const geoEndY  = wBotY - 42;
  const pipeDeep = geoEndY + 20;
  const R = 15;

  const flangeTopY  = geoEndY;
  const flangeThick = 12;
  const groundY     = flangeTopY + flangeThick + 6;

  // ── Build SVG string ────────────────────
  let s = `<defs>
  <clipPath id="tc">
    <rect x="${tCX-tW/2}" y="${tTop}" width="${tW}" height="${tH}" rx="${tRx}"/>
  </clipPath>

  <!-- Tank steel gradient -->
  <linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#0e2440"/>
    <stop offset="22%"  stop-color="#1a3d60"/>
    <stop offset="50%"  stop-color="#1e4870"/>
    <stop offset="78%"  stop-color="#1a3d60"/>
    <stop offset="100%" stop-color="#0a1830"/>
  </linearGradient>
  <linearGradient id="ss" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
    <stop offset="28%"  stop-color="#fff" stop-opacity=".22"/>
    <stop offset="52%"  stop-color="#fff" stop-opacity=".04"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".1"/>
  </linearGradient>

  <!-- Water gradient -->
  <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="${wL}"/>
    <stop offset="55%"  stop-color="${wB}"/>
    <stop offset="100%" stop-color="${wD}"/>
  </linearGradient>
  <linearGradient id="ws" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
    <stop offset="20%"  stop-color="#fff" stop-opacity=".15"/>
    <stop offset="55%"  stop-color="#fff" stop-opacity=".03"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".13"/>
  </linearGradient>
  <linearGradient id="tf" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#000" stop-opacity=".14"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="rt" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#4a7a9a"/>
    <stop offset="55%"  stop-color="#6ab0cc"/>
    <stop offset="100%" stop-color="#2a5a78"/>
  </linearGradient>
  <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#3a7a9a"/>
    <stop offset="100%" stop-color="#1a4a68"/>
  </linearGradient>

  <!-- Heat pump gradient -->
  <linearGradient id="vpg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#0c1e36"/>
    <stop offset="18%"  stop-color="#152d4c"/>
    <stop offset="50%"  stop-color="#1a3858"/>
    <stop offset="82%"  stop-color="#152d4c"/>
    <stop offset="100%" stop-color="#091420"/>
  </linearGradient>

  <!-- 3D pipe gradients (cross-section lighting) -->
  <linearGradient id="hpg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#fed7aa"/>
    <stop offset="20%"  stop-color="#f97316"/>
    <stop offset="65%"  stop-color="#c2410c"/>
    <stop offset="100%" stop-color="#7c2d12"/>
  </linearGradient>
  <linearGradient id="cpg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#bae6fd"/>
    <stop offset="20%"  stop-color="#38bdf8"/>
    <stop offset="65%"  stop-color="#0369a1"/>
    <stop offset="100%" stop-color="#0c4a6e"/>
  </linearGradient>
  <!-- Brine pipes – both same #047857 at 30% opacity -->
  <linearGradient id="gpO" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#047857" stop-opacity=".3"/>
    <stop offset="40%"  stop-color="#047857" stop-opacity=".3"/>
    <stop offset="100%" stop-color="#047857" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="gpI" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#047857" stop-opacity=".3"/>
    <stop offset="40%"  stop-color="#047857" stop-opacity=".3"/>
    <stop offset="100%" stop-color="#047857" stop-opacity=".3"/>
  </linearGradient>

  <!-- Filters -->
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="sdw" x="-15%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="7"
      flood-color="#000" flood-opacity=".38"/>
  </filter>
</defs>`;

  // ── GEO PIPES ──────────────────────────────────────────────
  // Brine pipes extend 4px INTO VP body (vpRX-4)
  const vpExit = vpRX - 4;
  // OUT: VP right-upper → right borehole pipe (p2x), rounded 90° bend down
  const oPath = `M${vpExit},${boY} H${p2x-R} Q${p2x},${boY} ${p2x},${boY+R} V${pipeDeep}`;
  // IN: left borehole pipe (p1x) → VP right-lower, rounded 90° bend up
  const iPath = `M${p1x},${pipeDeep} V${biY+R} Q${p1x},${biY} ${p1x-R},${biY} H${vpExit}`;

  // Pipe shadows (offset for 3D depth)
  s += `<path d="${oPath}" fill="none" stroke="#047857"
         stroke-width="13" stroke-linecap="round"
         opacity=".12" transform="translate(2,3)"/>`;
  s += `<path d="${iPath}" fill="none" stroke="#047857"
         stroke-width="13" stroke-linecap="round"
         opacity=".12" transform="translate(2,3)"/>`;
  // Pipe fill
  s += `<path d="${oPath}" fill="none" stroke="url(#gpO)"
         stroke-width="11" stroke-linecap="round"/>`;
  s += `<path d="${iPath}" fill="none" stroke="url(#gpI)"
         stroke-width="11" stroke-linecap="round"/>`;
  // Pipe specular shine (subtle since pipes are semi-transparent)
  s += `<path d="${oPath}" fill="none" stroke="#fff"
         stroke-width="2.5" stroke-linecap="round" opacity=".12"/>`;
  s += `<path d="${iPath}" fill="none" stroke="#fff"
         stroke-width="2.5" stroke-linecap="round" opacity=".12"/>`;

  // Animated flow on brine pipes (always running – brine always circulates)
  // OUT (VP→borehole): dark green animation stops AT flange top (not through it)
  const oAnimPath = `M${vpExit},${boY} H${p2x-R} Q${p2x},${boY} ${p2x},${boY+R} V${flangeTopY-8}`;
  // Brine UT (VP→borehole) = DARK GREEN (cooled fluid going into ground)
  s += `<path d="${oAnimPath}" fill="none" stroke="#047857"
         stroke-width="5" stroke-linecap="round"
         class="pf-geoO" opacity=".8"/>`;
  // IN (borehole→VP): bright cyan animation starts AT flange top (not from underground)
  const iAnimPath = `M${p1x},${flangeTopY-22} V${biY+R} Q${p1x},${biY} ${p1x-R},${biY} H${vpExit}`;
  // Brine INN (borehole→VP) = LIGHT CYAN (warm fluid coming from ground)
  s += `<path d="${iAnimPath}" fill="none" stroke="#5eead4"
         stroke-width="5" stroke-linecap="round"
         class="pf-geoI" opacity=".7"/>`;

  // Direction arrows
  // boY top pipe = BRINE INN (VP→borehole) → arrows point RIGHT toward borehole
  // biY bottom pipe = BRINE UT (borehole→VP) → arrows point LEFT toward VP
  const bMid = vpRX + (wCX - vpRX) / 2 - 10;
  for (let i = 0; i < 2; i++) {
    const ax = vpRX + 16 + i * 52;
    // Top (brine inn to well): right-pointing dark green arrows
    s += `<polygon points="${ax},${boY-4} ${ax+8},${boY} ${ax},${boY+4}"
           fill="#065f46" opacity=".8"/>`;
    // Bottom (brine ut from well): left-pointing light cyan arrows
    s += `<polygon points="${ax+8},${biY-4} ${ax},${biY} ${ax+8},${biY+4}"
           fill="#5eead4" opacity=".8"/>`;
  }

  // Brine temperature labels
  // Øvre port (boY): VP→borehole = "BRINE INN" (going into well), uses dark color for cool fluid
  // Nedre port (biY): borehole→VP = "BRINE UT" (coming out of well), uses light color for warm fluid
  const boTxt = nibe.brineOut != null ? `${nibe.brineOut.toFixed(1)} °C` : '–';
  const biTxt = nibe.brineIn  != null ? `${nibe.brineIn.toFixed(1)} °C`  : '–';
  // Top pipe = INN (going into well)
  s += `<text x="${bMid}" y="${boY-13}" text-anchor="middle"
         font-size="11" font-family="Inter,sans-serif"
         fill="#047857" font-weight="600">${boTxt}</text>`;
  s += `<text x="${bMid}" y="${boY-25}" text-anchor="middle"
         font-size="8" font-family="Inter,sans-serif"
         fill="#065f46" letter-spacing="1" opacity=".85">BRINE UT</text>`;
  // Bottom pipe = UT (coming out of well)
  s += `<text x="${bMid}" y="${biY+19}" text-anchor="middle"
         font-size="11" font-family="Inter,sans-serif"
         fill="#5eead4" font-weight="600">${biTxt}</text>`;
  s += `<text x="${bMid}" y="${biY+30}" text-anchor="middle"
         font-size="8" font-family="Inter,sans-serif"
         fill="#2dd4bf" letter-spacing="1" opacity=".85">BRINE INN</text>`;

  // ── HOT & COLD PIPES ───────────────────────────────────────
  const tRX = tCX + tW/2;

  // Hot/cold pipes – extend 4px INTO the VP body so they tuck in seamlessly
  const vpEnter = vpX + 4;  // pipe ends 4px inside VP edge
  // Shadows
  s += `<path d="M${tRX},${hotY} H${vpEnter}" fill="none" stroke="#7c2d12"
         stroke-width="13" stroke-linecap="round"
         opacity=".25" transform="translate(0,3)"/>`;
  s += `<path d="M${vpEnter},${coldY} H${tRX}" fill="none" stroke="#0c4a6e"
         stroke-width="13" stroke-linecap="round"
         opacity=".25" transform="translate(0,3)"/>`;
  // Fill
  s += `<path d="M${tRX},${hotY} H${vpEnter}" fill="none"
         stroke="url(#hpg)" stroke-width="11" stroke-linecap="round"/>`;
  s += `<path d="M${vpEnter},${coldY} H${tRX}" fill="none"
         stroke="url(#cpg)" stroke-width="11" stroke-linecap="round"/>`;
  // Shine
  s += `<path d="M${tRX},${hotY} H${vpEnter}" fill="none" stroke="#fff"
         stroke-width="3" stroke-linecap="round" opacity=".2"/>`;
  s += `<path d="M${vpEnter},${coldY} H${tRX}" fill="none" stroke="#fff"
         stroke-width="3" stroke-linecap="round" opacity=".2"/>`;

  // Animated flow overlays

  // Hot TUR (VP→tank): animation extends into VP
  s += `<path d="M${vpEnter},${hotY} H${tRX}" fill="none"
         stroke="#ffa040" stroke-width="5" stroke-linecap="round"
         class="pf-hot ${pClass}" opacity=".55"/>`;
  // Kald Retur (tank→VP): animation extends into VP
  s += `<path d="M${tRX},${coldY} H${vpEnter}" fill="none"
         stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"
         class="pf-cold ${pClass}" opacity=".55"/>`;

  // Keep subtle arrows for direction hint
  const pmid = tRX + (vpX - tRX) / 2;
  for (let i = 0; i < 2; i++) {
    const ax = tRX + 20 + i * 48;
    s += `<polygon points="${ax+8},${hotY-4} ${ax},${hotY} ${ax+8},${hotY+4}"
           fill="#f97316" opacity=".7"/>`;
    s += `<polygon points="${ax},${coldY-4} ${ax+8},${coldY} ${ax},${coldY+4}"
           fill="#38bdf8" opacity=".7"/>`;
  }

  // Pipe labels
  const hTxt = temps[0] != null ? `${temps[0].toFixed(1)} °C` : '–';
  const cTxt = temps[4] != null ? `${temps[4].toFixed(1)} °C` : '–';
  s += `<text x="${pmid}" y="${hotY-12}" text-anchor="middle"
         font-size="11" font-family="Inter,sans-serif"
         fill="#f97316" font-weight="600">${hTxt}</text>`;
  s += `<text x="${pmid}" y="${hotY-24}" text-anchor="middle"
         font-size="8" font-family="Inter,sans-serif"
         fill="#9a4a20" letter-spacing="1">VARM TUR</text>`;
  s += `<text x="${pmid}" y="${coldY+18}" text-anchor="middle"
         font-size="11" font-family="Inter,sans-serif"
         fill="#38bdf8" font-weight="600">${cTxt}</text>`;
  s += `<text x="${pmid}" y="${coldY+29}" text-anchor="middle"
         font-size="8" font-family="Inter,sans-serif"
         fill="#1a608a" letter-spacing="1">KALD RETUR</text>`;

  // Smooth pipe entry shadows where pipes meet VP body (no rectangular ports)
  // Just a subtle dark ellipse inside VP edge to suggest the pipe entering
  s += `<ellipse cx="${vpX+3}" cy="${hotY}" rx="2.5" ry="5"
         fill="#08111f" opacity=".5"/>`;
  s += `<ellipse cx="${vpX+3}" cy="${coldY}" rx="2.5" ry="5"
         fill="#08111f" opacity=".5"/>`;
  s += `<ellipse cx="${vpRX-3}" cy="${boY}" rx="2.5" ry="5"
         fill="#08111f" opacity=".5"/>`;
  s += `<ellipse cx="${vpRX-3}" cy="${biY}" rx="2.5" ry="5"
         fill="#08111f" opacity=".5"/>`;

  // ── HEAT PUMP ──────────────────────────────────────────────
  s += `<rect x="${vpX}" y="${vpY}" width="${vpW}" height="${vpH}" rx="14"
         fill="url(#vpg)" stroke="rgba(255,255,255,.07)"
         stroke-width="1.2" filter="url(#sdw)"/>`;

  // Brushed metal lines
  for (let i = 0; i < 13; i++) {
    s += `<line x1="${vpX+7}" y1="${vpY+13+i*18}"
           x2="${vpX+vpW-7}" y2="${vpY+13+i*18}"
           stroke="#fff" stroke-width=".3"
           opacity="${.013+i*.0012}"/>`;
  }

  // Left specular stripe
  s += `<rect x="${vpX+5}" y="${vpY+15}" width="8" height="${vpH-30}"
         rx="3.5" fill="#fff" fill-opacity=".04"/>`;

  // Logo band
  s += `<rect x="${vpX}" y="${vpY}" width="${vpW}" height="34"
         rx="14" fill="rgba(0,0,0,.2)"/>`;
  s += `<rect x="${vpX}" y="${vpY+20}" width="${vpW}" height="14"
         fill="rgba(0,0,0,.2)"/>`;
  s += `<text x="${vpX+vpW/2}" y="${vpY+21}" text-anchor="middle"
         font-size="11" font-family="Inter,sans-serif"
         fill="#bcd4ee" font-weight="700" letter-spacing="2.5">NIBE</text>`;
  s += `<text x="${vpX+vpW/2}" y="${vpY+32}" text-anchor="middle"
         font-size="6.5" font-family="Inter,sans-serif"
         fill="#4a7090" letter-spacing="2">S1256 · 8kW</text>`;

  // SCOP display screen
  s += `<rect x="${vpX+10}" y="${vpY+42}" width="${vpW-20}" height="78"
         rx="6" fill="#040c18" stroke="rgba(59,125,248,.16)" stroke-width="1"/>`;
  s += `<rect x="${vpX+12}" y="${vpY+44}" width="${vpW-24}" height="74"
         rx="5" fill="#050e1c"/>`;
  s += `<text x="${vpX+vpW/2}" y="${vpY+62}" text-anchor="middle"
         font-size="7" font-family="Inter,sans-serif"
         fill="#2a5a8a" letter-spacing="2">SCOP</text>`;
  s += `<text x="${vpX+vpW/2}" y="${vpY+90}" text-anchor="middle"
         font-size="27" font-family="JetBrains Mono,monospace"
         fill="#00d4b8" font-weight="600"
         filter="url(#glow)">${nibe.scop != null ? r2(nibe.scop).toFixed(2) : '–'}</text>`;

  // LED bar – 6 diodes, SCOP-driven (2.5=min, 5.0=max)
  // Special: >5.5 = green hearts, >5.9 = red heart emoji
  {
    const sMin=2.5, sMax=5.0, nL=6;
    const sv = nibe.scop ?? 0;
    const lit = sv <= sMin ? 0 : sv >= sMax ? nL
      : Math.round(((sv-sMin)/(sMax-sMin))*nL);
    const lf = lit / nL;
    const aCol = lf<=0?'#ef4444':lf<=.33?'#f97316':lf<=.5?'#eab308'
               : lf<=.67?'#84cc16':lf<=.83?'#22c55e':'#00ffaa';
    const marg=11, aw=vpW-marg*2, sp=aw/(nL-1), ly=vpY+132, lr=3.1;

    if (sv > 5.9) {
      // ❤️ Single big red heart centred – legendary SCOP
      s += `<text x="${vpX+vpW/2}" y="${ly+5}" text-anchor="middle"
             font-size="18" filter="url(#glow)">❤️</text>`;
    } else if (sv > 5.5) {
      // 💚 Six green heart emojis
      for (let i=0; i<nL; i++) {
        const lx = vpX + marg + i*sp;
        s += `<text x="${lx}" y="${ly+4}" text-anchor="middle"
               font-size="8" filter="url(#glow)">💚</text>`;
      }
    } else {
      // Normal LED circles
      for (let i=0; i<nL; i++) {
        const lx = vpX + marg + i*sp;
        if (i < lit) {
          s += `<circle cx="${lx}" cy="${ly}" r="${lr}"
                 fill="${aCol}" opacity=".95" filter="url(#glow)"/>`;
          s += `<circle cx="${lx}" cy="${ly}" r="${lr*.4}"
                 fill="#fff" opacity=".5"/>`;
        } else {
          s += `<circle cx="${lx}" cy="${ly}" r="${lr}"
                 fill="#1a3050" opacity=".55"/>`;
          s += `<circle cx="${lx}" cy="${ly}" r="${lr}"
                 fill="none" stroke="#2a4a70"
                 stroke-width=".65" opacity=".4"/>`;
        }
      }
    }
  }

  // Internals panel
  s += `<rect x="${vpX+8}" y="${vpY+146}" width="${vpW-16}" height="${vpH-162}"
         rx="7" fill="rgba(0,0,0,.2)"
         stroke="rgba(255,255,255,.04)" stroke-width="1"/>`;
  for (let i=0; i<4; i++) {
    s += `<line x1="${vpX+14}" y1="${vpY+158+i*17}"
           x2="${vpX+vpW-14}" y2="${vpY+158+i*17}"
           stroke="rgba(59,125,248,.06)" stroke-width="1"/>`;
  }

  // Mode detection using BT7 (Hot water top) trend:
  // BT7 rising  + power>0.1 → Tappevannsproduksjon (top of DHW tank heating up)
  // BT7 flat/falling + power>0.1 → Varmeproduksjon
  // power ≤ 0.1                  → Avslått
  const bt7H = H.bt7 || [];
  // Check trend over last 3 measurements for stability (avoids noise)
  const bt7Rising = bt7H.length >= 3 &&
    (bt7H[bt7H.length-1] - bt7H[bt7H.length-3]) > 0.1;
  const vpDHW = pwr > 0.2 && bt7Rising;
  const vpHeatFinal = pwr > 0.2 && !vpDHW;

  // Termisk effekt = elektrisk effekt × SCOP (øyeblikksverdi)
  // P_termisk (kW) = power (kW) × scop
  // Thermal power = electric draw × SCOP. NOTE: MyUplink updates System power
  // infrequently, so this reflects the last logged power value, not real-time.
  const scop2 = nibe.scop != null && nibe.scop > 0 ? nibe.scop : 1;
  const pTermisk = pwr > 0.2 ? r1(pwr * scop2) : null;
  const pwrStr = pTermisk != null ? `${pTermisk} kWₙ` : 'Stanset';
  const gmStr  = nibe.degMin != null ? `${Math.round(nibe.degMin)} GM` : '– GM';
  const pwrCol = vpHeatFinal ? '#22c55e' : pwr > 0.2 ? '#f59e0b' : '#3d5878';
  const gmCol  = nibe.degMin != null && nibe.degMin < -200 ? '#f59e0b' : '#3d5878';

  s += `<text id="svgPterm" x="${vpX+vpW/2}" y="${vpY+vpH-36}" text-anchor="middle"
         font-size="9" font-family="JetBrains Mono,monospace"
         fill="${pwrCol}" opacity=".7" style="cursor:pointer">${pwrStr}</text>`;
  // Invisible larger tap target over the power value for easier tooltip access
  s += `<rect id="svgPtermHit" x="${vpX+8}" y="${vpY+vpH-46}"
         width="${vpW-16}" height="16" fill="transparent" style="cursor:pointer"/>`;
  s += `<text x="${vpX+vpW/2}" y="${vpY+vpH-23}" text-anchor="middle"
         font-size="8.5" font-family="JetBrains Mono,monospace"
         fill="${gmCol}" opacity=".55">${gmStr}</text>`;

  // Mode label removed per user request

  // VP shine overlay
  s += `<rect x="${vpX}" y="${vpY}" width="${vpW}" height="${vpH}"
         rx="14" fill="url(#ss)" opacity=".38"/>`;

  // ── BOREHOLE ───────────────────────────────────────────────
  // Ground fill
  s += `<ellipse cx="${wCX}" cy="${groundY}" rx="50" ry="9"
         fill="#131f08" opacity=".62"/>`;
  // Grass
  for (let i=0; i<16; i++) {
    const gx = wCX - 44 + i*6;
    const gh = 4 + Math.sin(i*1.88)*2.8;
    s += `<line x1="${gx}" y1="${groundY}"
           x2="${gx+2}" y2="${groundY-gh}"
           stroke="#2d5a18" stroke-width="1.4"
           stroke-linecap="round"
           opacity="${.38+i*.025}"/>`;
  }

  // Flange shadow
  s += `<ellipse cx="${wCX}" cy="${flangeTopY+flangeThick+5}"
         rx="34" ry="5.5" fill="#000" fill-opacity=".35"/>`;
  // Flange dark underside
  s += `<rect x="${wCX-32}" y="${flangeTopY+6}" width="64" height="${flangeThick}"
         rx="6" fill="#92400e" stroke="#78350f" stroke-width="1"/>`;
  // Flange top face
  s += `<rect x="${wCX-32}" y="${flangeTopY}" width="64" height="${flangeThick}"
         rx="6" fill="#fbbf24" stroke="#d97706" stroke-width="1.2"/>`;
  // Flange shine
  s += `<rect x="${wCX-24}" y="${flangeTopY+1}" width="48" height="5"
         rx="3" fill="#fde68a" opacity=".48"/>`;

  // Center hole
  s += `<ellipse cx="${wCX}" cy="${flangeTopY+6}" rx="15" ry="5"
         fill="#92400e" stroke="#78350f"/>`;
  s += `<ellipse cx="${wCX}" cy="${flangeTopY+5}" rx="15" ry="5"
         fill="#7c2d12" opacity=".8"/>`;

  // Brine pipe sections through flange
  s += `<rect x="${p2x-5}" y="${flangeTopY-2}" width="10" height="${flangeThick+4}"
         rx="3" fill="#047857" stroke="#065f46" stroke-width="1"/>`;
  s += `<rect x="${p2x-2}" y="${flangeTopY}" width="3.5" height="${flangeThick}"
         rx="1.5" fill="#34d399" fill-opacity=".28"/>`;
  s += `<rect x="${p1x-5}" y="${flangeTopY-2}" width="10" height="${flangeThick+4}"
         rx="3" fill="#0d9488" stroke="#0f766e" stroke-width="1"/>`;
  s += `<rect x="${p1x-2}" y="${flangeTopY}" width="3.5" height="${flangeThick}"
         rx="1.5" fill="#5eead4" fill-opacity=".28"/>`;

  // Bolts
  for (const bx of [wCX-24, wCX+24]) {
    s += `<circle cx="${bx}" cy="${flangeTopY+6}" r="3.8"
           fill="#d1d5db" stroke="#9ca3af" stroke-width=".75"/>`;
    s += `<circle cx="${bx}" cy="${flangeTopY+6}" r="1.7" fill="#6b7280"/>`;
    s += `<line x1="${bx-1.2}" y1="${flangeTopY+6}"
           x2="${bx+1.2}" y2="${flangeTopY+6}"
           stroke="#374151" stroke-width=".8"/>`;
    s += `<line x1="${bx}" y1="${flangeTopY+4.7}"
           x2="${bx}" y2="${flangeTopY+7.3}"
           stroke="#374151" stroke-width=".8"/>`;
  }

  // Borehole labels (below flange on grass)
  s += `<text x="${wCX}" y="${groundY+20}" text-anchor="middle"
         font-size="8.5" font-family="Inter,sans-serif"
         fill="#3a8a6a" letter-spacing="1.5" opacity=".85">GEOBRØNN</text>`;
  s += `<text x="${wCX}" y="${groundY+31}" text-anchor="middle"
         font-size="7.5" font-family="Inter,sans-serif"
         fill="#2a5a4a" opacity=".65">250 m</text>`;

  // ── ACCUMULATOR TANK ──────────────────────────────────────
  // Drop shadow below tank
  s += `<ellipse cx="${tCX}" cy="${tBot+8}" rx="${tW/2-5}" ry="4"
         fill="#000" fill-opacity=".22"/>`;

  // Tank body
  s += `<rect x="${tCX-tW/2}" y="${tTop}" width="${tW}" height="${tH}"
         rx="${tRx}" fill="url(#sg)"
         stroke="rgba(255,255,255,.055)" stroke-width="1.1"
         filter="url(#sdw)"/>`;

  // Water (clipped)
  s += `<g clip-path="url(#tc)">
    <rect x="${tCX-tW/2}" y="${fillY}" width="${tW}" height="${tBot-fillY}"
      fill="url(#wg)"/>
    <rect x="${tCX-tW/2}" y="${fillY}" width="${tW}" height="${tBot-fillY}"
      fill="url(#ws)"/>
    <ellipse cx="${tCX}" cy="${fillY}" rx="${tW/2-1}" ry="6"
      fill="${wS}" fill-opacity=".38"/>
    <rect x="${tCX-tW/2}" y="${tTop}" width="${tW}" height="${tH}"
      fill="url(#tf)"/>
    <rect x="${tCX-tW/2}" y="${tTop}" width="${tW}" height="${tH}"
      fill="url(#ss)"/>
  </g>`;

  // Top dome (seamless cap)
  s += `<rect x="${tCX-tW/2}" y="${tTop}" width="${tW}"
         height="${eRy*2}" rx="${tW/2}"
         fill="url(#sg)" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`;
  s += `<rect x="${tCX-tW/2}" y="${tTop}" width="${tW}"
         height="${eRy*2}" rx="${tW/2}"
         fill="url(#ss)" opacity=".5"/>`;
  s += `<ellipse cx="${tCX}" cy="${tTop+eRy*.7}"
         rx="${tW/2-8}" ry="${eRy*.4}"
         fill="#fff" fill-opacity=".06"/>`;

  // Reinforcement bands
  [tTop+tH*.25, tTop+tH*.5, tTop+tH*.75].forEach(by => {
    s += `<rect x="${tCX-tW/2+2}" y="${by-3}" width="${tW-4}" height="5.5"
           rx="2" fill="url(#bg2)"
           stroke="rgba(255,255,255,.05)" stroke-width=".5" opacity=".7"/>`;
  });

  // Left specular stripe
  s += `<rect x="${tCX-tW/2+7}" y="${tTop+eRy}" width="7" height="${tH-eRy*2}"
         rx="3" fill="#fff" fill-opacity=".04"/>`;

  // Bottom is naturally rounded by main tank body rx – no separate cap needed

  // Sensor markers + labels (all left side, aligned column)
  SENSORS.forEach((sen, i) => {
    const sy  = tTop + (1 - sen.pct/100) * tH;
    const t   = temps[i];
    const col = tCol(t);
    s += `<line x1="${dotX}" y1="${sy}" x2="${lblX+28}" y2="${sy}"
           stroke="${col}" stroke-width="1.1"
           stroke-dasharray="3,2.5" opacity=".7"/>`;
    s += `<circle cx="${dotX}" cy="${sy}" r="4"
           fill="${col}" stroke="#08111f" stroke-width="1.2"/>`;
    s += `<circle cx="${dotX}" cy="${sy}" r="1.8"
           fill="#fff" fill-opacity=".36"/>`;
    s += `<text x="${lblX+26}" y="${sy+4}" text-anchor="end"
           font-size="10.5" font-family="JetBrains Mono,monospace"
           fill="${col}" font-weight="500">${t != null ? t.toFixed(1)+'°' : '–'}</text>`;
  });

  // Tank labels
  s += `<text x="${tCX}" y="${tTop-15}" text-anchor="middle"
         font-size="8" font-family="Inter,sans-serif"
         fill="#3a6a90" letter-spacing="2" opacity=".8">AKKUMULATORTANK</text>`;
  s += `<text x="${tCX}" y="${tTop-5}" text-anchor="middle"
         font-size="7.5" font-family="Inter,sans-serif"
         fill="#2a5070" opacity=".6">500 L</text>`;

  document.getElementById('svg').innerHTML = s;
  // Bind thermal power tooltip to its tap target in the SVG
  const ptHit = document.getElementById('svgPtermHit');
  if (ptHit) btt(ptHit, 'Termisk effekt', 'pTerm', 'kW');
}

// ═══════════════════════════════════════════
// RENDER PANELS
// ═══════════════════════════════════════════
function renderPanels(temps, nibe) {
  // Sensor rows
  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  const HK = ['t100','t75','t50','t25','t0'];
  SENSORS.forEach((sen, i) => {
    const t = temps[i], col = tCol(t);
    const d = document.createElement('div');
    d.className = 'sr';
    d.innerHTML =
      `<div class="sd" style="background:${col};box-shadow:0 0 5px ${col}44"></div>`+
      `<div class="sp">${sen.pct}%</div>`+
      `<div class="sn">${sen.name}</div>`+
      `<div class="sv">${t != null ? t.toFixed(1)+'\u202F°C' : '–'}</div>`;
    btt(d, sen.name, HK[i], '°C');
    rows.appendChild(d);
  });

  // Tank metrics
  const vld    = temps.filter(t => t != null);
  const snitt  = vld.length ? r1(vld.reduce((a,b) => a+b, 0)/vld.length) : null;
  const topp   = temps[0], bunn = temps[4], vp = temps[1];
  const energi = snitt != null ? r1(Math.max(0, KWH*(snitt-REF))) : null;
  const dtb    = (topp != null && bunn != null) ? r1(topp-bunn) : null;
  const dvp    = (vp != null && bunn != null)   ? r1(vp-bunn)   : null;

  const fmt = (v, dec=1) => v != null ? v.toFixed(dec) : null;
  const setM = (id, val, unit) => {
    document.getElementById(id).innerHTML = val != null
      ? `${val}<span class="mu">${unit}</span>` : '–';
  };
  setM('vSnitt',  fmt(snitt),  '\u202F°C');
  setM('vEnergi', fmt(energi), '\u202FkWh');
  setM('vDtb',    fmt(dtb),    '\u202FK');
  setM('vDvp',    fmt(dvp),    '\u202FK');

  // NIBE
  const sc = nibe.scop;
  document.getElementById('vScop').textContent =
    sc != null ? r2(sc).toFixed(2) : '–';

  const pwr  = nibe.power ?? 0;
  // BT7 trend (over 3 measurements): rising = DHW production
  const bt7p = H.bt7 || [];
  const bt7R = bt7p.length >= 3 &&
    (bt7p[bt7p.length-1] - bt7p[bt7p.length-3]) > 0.1;
  const isDHW  = pwr > 0.2 && bt7R;
  const isHeat = pwr > 0.2 && !isDHW;
  const modeTxt = isHeat ? 'Varmeproduksjon' :
                  isDHW  ? 'Tappevannsproduksjon' :
                           'Avslått';
  document.getElementById('vMod').textContent = modeTxt;

  const fmtB = (v, id) => {
    document.getElementById(id).innerHTML = v != null
      ? `${v.toFixed(1)}<span class="bu">\u202F°C</span>` : '–';
  };
  fmtB(nibe.brineIn,  'vBrineIn');
  fmtB(nibe.brineOut, 'vBrineOut');

  // Bind tooltips
  btt(document.getElementById('mSnitt'),   'Snitt temperatur', 'snitt',   '°C');
  btt(document.getElementById('mEnergi'),  'Energi i tank',    'energi',  'kWh');
  btt(document.getElementById('mDtb'),     'ΔT Topp–Bunn',     'dtb',     'K');
  btt(document.getElementById('mDvp'),     'ΔT VP',            'dvp',     'K');
  btt(document.getElementById('mScop'),    'SCOP årsytelse',   'scop',    '');
  btt(document.getElementById('mBrineIn'), 'Brine inn BT10',   'brineIn', '°C');
  btt(document.getElementById('mBrineOut'),'Brine ut BT11',    'brineOut','°C');
}

// ═══════════════════════════════════════════
// RENDER (main entry point)
// ═══════════════════════════════════════════
function render(temps, nibe, isLive) {
  if (isLive) {
    ph('t100', temps[0]); ph('t75', temps[1]); ph('t50', temps[2]);
    ph('t25',  temps[3]); ph('t0',  temps[4]);
    const vld = temps.filter(t => t != null);
    if (vld.length) {
      const sn = r1(vld.reduce((a,b) => a+b, 0) / vld.length);
      ph('snitt', sn);
      ph('energi', r1(Math.max(0, KWH*(sn-REF))));
    }
    if (temps[0] != null && temps[4] != null) ph('dtb', r1(temps[0]-temps[4]));
    if (temps[1] != null && temps[4] != null) ph('dvp', r1(temps[1]-temps[4]));
    if(nibe.scop!=null) H.scop.push(r2(nibe.scop)), H.scop.length>MAX_PTS&&H.scop.shift();
    ph('brineIn',  nibe.brineIn);
    ph('brineOut', nibe.brineOut);
    ph('bt7',      nibe.bt7);
    // Thermal power = electric power × SCOP (only when compressor running)
    if(nibe.power!=null && nibe.scop!=null && nibe.power>0.2)
      ph('pTerm', r1(nibe.power*nibe.scop));
  }
  buildSvg(temps, nibe);
  renderPanels(temps, nibe);
}

// ═══════════════════════════════════════════
// SCOP INSIGHTS (from Homey Logic variable)
// ═══════════════════════════════════════════
let _scopDone = false, _lastHid = '', _failCount = 0, _savCounter = 0;

async function loadScopInsights(base, key) {
  const curHid = document.getElementById('hid').value.trim();
  if (_lastHid && _lastHid !== curHid) {
    _scopDone = false;
    Object.keys(H).forEach(k => H[k] = []);
    try { localStorage.removeItem(LS_KEY); } catch(_) {}
  }
  _lastHid = curHid;
  if (_scopDone) return;

  try {
    const r = await fetch(`${base}/api/manager/insights/log`,
      { headers: {'Authorization':'Bearer '+key} });
    if (!r.ok) { _scopDone=true; return; }
    const logs = await r.json();

    const scopLog = Object.values(logs).find(l =>
      l.ownerUri === 'homey:manager:logic' &&
      l.type === 'number' &&
      l.title === 'SCOP');
    if (!scopLog) { _scopDone=true; return; }

    const uri = encodeURIComponent(scopLog.uri);
    const id  = encodeURIComponent(scopLog.id);
    const r2 = await fetch(
      `${base}/api/manager/insights/log/${uri}/${id}/entry?resolution=last24Hours`,
      { headers: {'Authorization':'Bearer '+key} });
    if (!r2.ok) { _scopDone=true; return; }

    const entries = await r2.json();
    if (!Array.isArray(entries) || !entries.length) { _scopDone=true; return; }

    const data = entries
      .filter(e => typeof e.v === 'number' && isFinite(e.v))
      .map(e => r2(e.v));
    if (data.length > H.scop.length) H.scop = data.slice(-MAX_PTS);
    _scopDone = true;
  } catch(_) { _scopDone = true; }
}

// ═══════════════════════════════════════════
// HOMEY FETCH
// ═══════════════════════════════════════════
const sv  = (k,v) => { try { localStorage.setItem(k,v); } catch(_) {} };
const lv  = k => { try { return localStorage.getItem(k); } catch(_) { return null; } };
const savCfg = () => {
  sv('hid',  document.getElementById('hid').value.trim());
  sv('hkey', document.getElementById('hkey').value.trim());
};
const lodCfg = () => {
  const i=lv('hid'), k=lv('hkey');
  if (i) document.getElementById('hid').value  = i;
  if (k) document.getElementById('hkey').value = k;
};

function setSpin(on) {
  const el = document.getElementById('rico');
  on ? el.classList.add('spin') : el.classList.remove('spin');
}

let _lastStatusTxt = '', _lastStatusType = '';
function setStatus(txt, type) {
  type = type || '';
  if (_lastStatusTxt === txt && _lastStatusType === type) return;  // no-op if unchanged
  _lastStatusTxt = txt; _lastStatusType = type;
  const el = document.getElementById('sts');
  el.textContent = txt;
  el.className = 'hdr-s' + (type ? ' '+type : '');
}

async function doFetch() {
  savCfg();
  const hid  = document.getElementById('hid').value.trim();
  const key  = document.getElementById('hkey').value.trim();
  const errEl = document.getElementById('err');
  errEl.style.display = 'none';

  if (!hid || !key) {
    errEl.style.display = 'block';
    errEl.innerHTML = 'Fyll inn Homey ID og API Key under ⚙ Tilkobling.';
    document.getElementById('cfb').classList.add('open');
    document.getElementById('cft').classList.add('open');
    return;
  }

  setSpin(true);
  const base = hid.includes('.') ? `https://${hid}` : `https://${hid}.connect.athom.com`;

  try {
    const res = await fetch(`${base}/api/manager/devices/device`,
      { headers: {'Authorization':'Bearer '+key} });
    if (res.status === 401) throw new Error('401 – API Key ugyldig eller utløpt');
    if (res.status === 403) throw new Error('403 – Mangler rettigheter');
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const devs = Object.values(await res.json());

    // gv rounds to 1 decimal, gv2 to 2 decimals (for SCOP precision)
    const gv = name => {
      const d = devs.find(x => x.name === name);
      if (!d) return null;
      const c = d.capabilitiesObj?.[CAP];
      return (c && typeof c.value === 'number') ? r1(c.value) : null;
    };
    const gv2 = name => {
      const d = devs.find(x => x.name === name);
      if (!d) return null;
      const c = d.capabilitiesObj?.[CAP];
      return (c && typeof c.value === 'number') ? r2(c.value) : null;
    };

    const temps = SENSORS.map(s => gv(s.dev));
    const nibe  = {
      scop    : gv2(DEV.scop),
      brineIn : gv(DEV.brineIn),
      brineOut: gv(DEV.brineOut),
      supply  : gv(DEV.supply),
      power   : gv(DEV.power),
      hotWater: gv(DEV.hotWater),
      compHz  : gv(DEV.compHz),
      degMin  : gv(DEV.degMin),
      bt7     : gv(DEV.bt7),
    };

    await loadScopInsights(base, key);
    render(temps, nibe, true);
    _savCounter = (_savCounter + 1) % 4;
    if (_savCounter === 0) savH();  // save every 4th fetch (~1 min)

    _failCount = 0;  // reset backoff on success
    const pts = H.t100.length;
    const pStr = pts > 0 ? ` · ${pts}p` : '';
    setStatus('Live · '+new Date().toLocaleTimeString('nb-NO',
      {hour:'2-digit',minute:'2-digit'})+pStr, 'live');

  } catch(e) {
    setStatus('Tilkoblingsfeil', 'err');
    errEl.style.display = 'block';
    errEl.innerHTML = `<strong>Feil:</strong> ${e.message}`;
    // Exponential backoff: retry after 30s, then 60s, then 120s
    _failCount = Math.min(_failCount + 1, 3);
    const backoff = 30 * 1000 * Math.pow(2, _failCount - 1);
    setTimeout(() => { if (!document.hidden) doFetch(); }, backoff);
  } finally {
    setSpin(false);
  }
}

// ── Config toggle ──
function tCfg() {
  const b = document.getElementById('cfb');
  const t = document.getElementById('cft');
  b.classList.toggle('open');
  t.classList.toggle('open');
}

// ── Auto-refresh ──
// Adaptive refresh: 15s active, pause in background, immediate fetch on resume
let _refreshTimer = null;
let _wasHidden = false;

function startAutoRefresh() {
  if (_refreshTimer) return;
  _refreshTimer = setInterval(() => {
    if (!document.hidden) doFetch();
  }, 15 * 1000);
}

function stopAutoRefresh() {
  if (_refreshTimer) { clearInterval(_refreshTimer); _refreshTimer = null; }
}

// Page Visibility API – pause when backgrounded, fetch immediately on resume
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    _wasHidden = true;
    stopAutoRefresh();
  } else if (_wasHidden) {
    _wasHidden = false;
    doFetch();
    startAutoRefresh();
  }
}, { passive: true });

startAutoRefresh();

// ── Startup ──
lodCfg();
lodH();

// Save history when page is hidden/closed to avoid data loss
document.addEventListener('visibilitychange', () => {
  if (document.hidden) savH();
}, { passive: true });
window.addEventListener('pagehide', () => savH(), { passive: true });
render(
  [58.4, 49.2, 40.1, 33.7, 29.3],
  { scop:3.84, brineIn:8.2, brineOut:2.1,
    supply:55, power:3.2, hotWater:0,
    compHz:null, degMin:-248, bt7:55.5 },
  false
);
setStatus('Demo · Fyll inn tilkobling');
setTimeout(doFetch, 400);
</script>
